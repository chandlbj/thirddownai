name: CFB Player Season Stats Sync

on:
  schedule:
    # Weekly, Mondays at 13:00 UTC (after the weekend's games are final).
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

jobs:
  sync-player-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync cfb_player_season_stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Lower priority per the Aug 29 decision — don't fail the whole
        # workflow run if CFBD has nothing yet this early in the season.
        run: python scripts/ingest_player_season_stats.py --year ${{ vars.CFB_SEASON_YEAR || '2026' }} || echo "player stats sync had an issue, continuing"
