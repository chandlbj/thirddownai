name: News Monitor (X)

on:
  schedule:
    # Every 30 minutes, per the spec's starting cadence ("30 min is plenty
    # for injury/beat news... tighten later"). --lookback-minutes in the
    # script defaults to 35 to overlap this window and never miss a post
    # between runs (dedup on source_tweet_id makes the overlap harmless).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  monitor-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Monitor X and triage news
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/monitor_news.py
