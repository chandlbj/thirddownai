name: CFB Games Sync

on:
  schedule:
    # 12:00 UTC daily = 8am ET / 7am CT during CFB season. Games/scores
    # refresh at most once a day; harmless (and cheap) to run this often
    # since the upsert is idempotent by CFBD game id.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  sync-games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync cfb_games
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest_games.py --year ${{ vars.CFB_SEASON_YEAR || '2026' }}
